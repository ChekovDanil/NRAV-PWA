<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="robots" content="noindex,nofollow" />
  <title>NRAV Control Center</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">NRAV</p>
        <h1>Control Center</h1>
      </div>
      <div class="topbar-actions">
        <span id="snapshotAge" class="muted">Загрузка…</span>
        <button id="refreshButton" class="button" type="button">Обновить</button>
      </div>
    </header>

    <section id="health" class="summary" aria-live="polite"></section>

    <section class="section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Команда</p>
          <h2>Агенты</h2>
        </div>
        <div class="legend">
          <span><i class="dot active"></i>активен</span>
          <span><i class="dot waiting"></i>ожидает</span>
          <span><i class="dot blocked"></i>блокер</span>
          <span><i class="dot stale"></i>давно без сигнала</span>
        </div>
      </div>
      <div id="agents" class="agents"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Ритм</p>
          <h2>Цикл часа</h2>
        </div>
      </div>
      <div id="timeline" class="timeline" aria-label="Расписание агентов"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Интеграция</p>
          <h2>Server Integration Map</h2>
        </div>
      </div>
      <div id="integrationMap" class="integration-grid"></div>
    </section>

    <footer>
      <span id="sourceLine">Источник: agent-status.json</span>
      <span>Внешнюю авторизацию нужно включить на уровне hosting (например, Cloudflare Access).</span>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
